name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv lock --check
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python -m unittest discover -s tests -v
