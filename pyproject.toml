[project]
name = "layagrep"
version = "0.1.0"
description = "Semantic grep for lines using Laya's calibrated noul decisions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "laya>=0.3.20,<0.4",
]

[project.scripts]
layagrep = "layagrep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = ["src", "tests"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["laya", "laya.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/layagrep"]
