[project]
name = "layagrep"
version = "0.1.0"
description = "Semantic grep for lines using Laya's calibrated noul decisions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "laya>=0.3.20,<0.4",
]

[project.scripts]
layagrep = "layagrep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layagrep"]
